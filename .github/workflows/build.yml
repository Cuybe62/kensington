name: Windows core and diagnostics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Check Windows PowerShell script syntax
        shell: powershell
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Build diagnostics (no SolidWorks SDK required)
        run: msbuild src/TrackballCAD.UI/TrackballCAD.UI.csproj /restore /p:Configuration=Release /p:Platform=x64
      - name: Build tests
        run: msbuild tests/TrackballCAD.Tests/TrackballCAD.Tests.csproj /restore /p:Configuration=Release /p:Platform=x64
      - name: Run tests
        run: ./tests/TrackballCAD.Tests/bin/Release/net48/TrackballCAD.Tests.exe
